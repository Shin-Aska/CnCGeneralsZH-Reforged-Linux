name: Windows MSVC check

# Throwaway: builds the PR 120 tip with MSVC (upstream main built clean in run 39736910381). Lives only on ci/windows-msvc-check.
on:
  push:
    branches: [ci/windows-msvc-check]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        tree:
          - { name: pr-120, sha: a40599223ddd45fc80dda12fda05148f19849799 }
    name: ${{ matrix.tree.name }}
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out the tree under test
        run: git checkout --detach ${{ matrix.tree.sha }}
      - name: Fetch third-party sources
        run: powershell -NoProfile -ExecutionPolicy Bypass -File GeneralsMD\Code\Tools\vendor.ps1
      - name: Configure
        run: cmake -S GeneralsMD/Code -B build64 -G "Visual Studio 17 2022" -A x64
      - name: Build everything, Release
        run: cmake --build build64 --config Release -- /m /v:minimal '/flp:logfile=msbuild.log;verbosity=normal'
      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-${{ matrix.tree.name }}
          path: msbuild.log
          if-no-files-found: ignore
