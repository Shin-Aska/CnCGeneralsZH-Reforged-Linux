name: Exact SHA Linux validation
run-name: Validate ${{ inputs.candidate_sha }} (${{ inputs.label }})

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full lowercase 40-character source commit SHA available in this fork
        required: true
        type: string
      label:
        description: Human-readable baseline or upstream branch label (metadata only)
        required: false
        default: baseline
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  CANDIDATE_LABEL: ${{ inputs.label }}
  ZH_UNATTENDED: '1'
  ZH_AUDIO_BACKEND: 'null'
  ZH_GAME_DATA: ''
  ZH_DATA_DIR: ''
  ZH_FFREF_CAPTURE_DIR: ''
  ZH_PORTABLE_CMAKE: ''

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Validate immutable source selector
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::candidate_sha must be 40 lowercase hexadecimal characters'; exit 1; }
      - name: Check out validation harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - name: Check out exact candidate separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - name: Record and verify source provenance
        run: |
          mkdir -p "$RUNNER_TEMP/reports" "$RUNNER_TEMP/vendor-tmp"
          actual=$(git -C candidate rev-parse HEAD)
          [[ "$actual" == "$CANDIDATE_SHA" ]]
          [[ "$(git -C harness rev-parse HEAD)" == "$GITHUB_SHA" ]]
          python3 harness/.github/scripts/exact-sha-validation.py metadata
          git -C candidate status --porcelain --untracked-files=no > "$RUNNER_TEMP/reports/tracked-before.txt"
          test ! -s "$RUNNER_TEMP/reports/tracked-before.txt"
      # Reuse the fork default branch's completed pinned dependency downloads.
      # Restore only: validation candidates never publish dependency cache contents.
      - name: Restore known code dependency downloads from the fork default branch
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vendor-tmp/zhr-vendor
          key: linux-vendor-v1-285ac9b7331ac3e98b4f60d4bb6d3d5ee2145ec556dcfc68fec031fb3f548156
      - name: Verify restored zlib archive before candidate dependency staging
        run: |
          archive="$RUNNER_TEMP/vendor-tmp/zhr-vendor/zlib-1.1.4.tar.gz"
          [[ -f "$archive" ]] || { echo '::error::Known dependency cache did not provide zlib-1.1.4; refusing the currently invalid upstream download'; exit 1; }
          gzip -t "$archive"
          sha256sum "$archive" > "$RUNNER_TEMP/reports/cached-zlib.sha256"
      - name: Restore verified CMake download
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-tools/cmake
          key: linux-cmake-x86_64-v1-e2e5b4b515a3169c4b128c30dd3893b09641805888cc299d5bdd0b5544c06395
      - name: Prepare only the disposable GitHub runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-14 g++-14 lld ninja-build make pkg-config curl unzip xz-utils perl \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols libegl-dev libdrm-dev libgbm-dev libvulkan-dev \
            mesa-vulkan-drivers libfontconfig-dev fonts-dejavu-core xvfb xauth spirv-tools unifdef
          bash harness/.github/scripts/linux-ci-tools.sh cmake "$RUNNER_TEMP/ci-tools"
          df -h | tee "$RUNNER_TEMP/reports/disk.txt"
          g++-14 --version > "$RUNNER_TEMP/reports/compiler.txt"
          dpkg-query -W > "$RUNNER_TEMP/reports/runner-packages.txt"
      - name: Fetch pinned code dependencies without optional art
        env:
          TMPDIR: ${{ runner.temp }}/vendor-tmp
        run: |
          python3 harness/.github/scripts/exact-sha-validation.py vendor
          script=candidate/GeneralsMD/Code/Tools/vendor.ci-code-only.sh
          trap 'rm -f "$script"' EXIT
          bash "$script" 2>&1 | tee "$RUNNER_TEMP/reports/vendor.log"
      - name: Configure Linux Release
        run: |
          "$ZH_CMAKE" -S candidate/GeneralsMD/Code -B "$RUNNER_TEMP/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DPython3_EXECUTABLE=/usr/bin/python3 -DZH_GAME_DATA= -DZH_SPIRV_VAL=/usr/bin/spirv-val \
            2>&1 | tee "$RUNNER_TEMP/reports/configure.log"
      - name: Build engine and all default test targets
        run: |
          jobs=$(nproc)
          (( jobs <= 4 )) || jobs=4
          "$ZH_CMAKE" --build "$RUNNER_TEMP/build" --parallel "$jobs" \
            2>&1 | tee "$RUNNER_TEMP/reports/build.log"
      - name: Run all CTest cases with software Vulkan and Xvfb
        id: ctest
        timeout-minutes: 50
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_VIDEO_DRIVER: offscreen
        run: |
          icd=$(find /usr/share/vulkan/icd.d -maxdepth 1 -name '*lvp*.json' -print -quit)
          [[ -n "$icd" && -f "$icd" ]]
          export VK_ICD_FILENAMES="$icd" VK_DRIVER_FILES="$icd"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
          mkdir -m 700 -p "$XDG_RUNTIME_DIR"
          "$(dirname "$ZH_CMAKE")/ctest" --test-dir "$RUNNER_TEMP/build" --show-only=json-v1 \
            > "$RUNNER_TEMP/reports/test-inventory.json"
          timeout --signal=TERM --kill-after=30s 48m \
            xvfb-run -a --server-args='-screen 0 1280x720x24 -nolisten tcp' \
            "$(dirname "$ZH_CMAKE")/ctest" --test-dir "$RUNNER_TEMP/build" \
            --no-tests=error --parallel 2 --timeout 600 --output-on-failure \
            --output-junit "$RUNNER_TEMP/reports/ctest.xml" \
            2>&1 | tee "$RUNNER_TEMP/reports/ctest.log"
      - name: Report test counts and omissions
        if: ${{ always() && steps.ctest.outcome != 'skipped' }}
        run: python3 harness/.github/scripts/exact-sha-validation.py summary
      - name: Verify tracked candidate files stayed pristine
        if: ${{ always() }}
        run: |
          git -C candidate diff --exit-code HEAD -- > "$RUNNER_TEMP/reports/tracked-diff.txt"
          git -C candidate status --porcelain --untracked-files=no > "$RUNNER_TEMP/reports/tracked-after.txt"
          test ! -s "$RUNNER_TEMP/reports/tracked-after.txt"
      - name: Stage the tested binary and code-only overlay
        run: python3 harness/.github/scripts/exact-sha-validation.py stage
      - name: Upload successful validation handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-validation-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/handoff/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Preserve diagnostics on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-validation-diagnostics-${{ inputs.candidate_sha }}
          path: |
            ${{ runner.temp }}/reports/
            ${{ runner.temp }}/build/CMakeCache.txt
            ${{ runner.temp }}/build/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/build/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 14
