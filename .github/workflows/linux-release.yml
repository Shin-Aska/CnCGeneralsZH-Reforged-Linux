name: Linux build and release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Fork PRs need no secrets. Only the final, tag-only job can write releases.
permissions:
  contents: read

concurrency:
  group: linux-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  ZH_UNATTENDED: '1'
  ZH_AUDIO_BACKEND: 'null'
  ZH_PACKAGE_MAINTAINER: 'Zero Hour Reforged Linux maintainers <8596711+Shin-Aska@users.noreply.github.com>'
  SNIPER_IMAGE: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest

jobs:
  build:
    name: Sniper x86_64 build and software rendering
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the ephemeral runner
        run: |
          # Only on this disposable hosted runner; never used by local build scripts.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl unzip xz-utils rsync zstd python3 binutils \
            libfontconfig1 fonts-dejavu-core libvulkan1 mesa-vulkan-drivers \
            libx11-6 libxext6 libxcursor1 libxi6 libxrandr2 libxkbcommon0 \
            xvfb xauth spirv-tools unifdef
          sudo apt-get clean
          df -h "$RUNNER_TEMP"
          free_kib=$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')
          (( free_kib >= 18 * 1024 * 1024 )) || { echo '::error::Need 18 GiB free for the SDK and build'; exit 1; }
          mkdir -p "$RUNNER_TEMP/vendor-tmp" "$RUNNER_TEMP/build" "$RUNNER_TEMP/portable" "$RUNNER_TEMP/reports"
          jobs=$(nproc)
          (( jobs <= 4 )) || jobs=4
          echo "ZH_BUILD_JOBS=$jobs" >> "$GITHUB_ENV"

      - name: Cache pinned dependency downloads (no game data)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vendor-tmp/zhr-vendor
          key: linux-vendor-v1-${{ hashFiles('GeneralsMD/Code/Tools/vendor.sh', 'GeneralsMD/Code/Libraries/Source/**/*.patch') }}

      - name: Cache verified CMake distribution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-tools/cmake
          key: linux-cmake-x86_64-v1-${{ hashFiles('.github/scripts/linux-ci-tools.sh') }}

      - name: Validate CI helpers
        run: |
          bash -n .github/scripts/linux-ci-tools.sh GeneralsMD/Code/Tools/linux-{portable,packages,packages-check,check}.sh
          bash GeneralsMD/Code/Tests/test_vendor_no_art.sh
          python3 GeneralsMD/Code/Tests/test_linux_release.py

      - name: Fetch code dependencies and verified build tool
        env:
          TMPDIR: ${{ runner.temp }}/vendor-tmp
        run: |
          bash GeneralsMD/Code/Tools/vendor.sh --no-art
          bash .github/scripts/linux-ci-tools.sh cmake "$RUNNER_TEMP/ci-tools"

      - name: Resolve the official SDK once to an immutable image digest
        run: |
          docker pull --platform linux/amd64 "$SNIPER_IMAGE"
          sdk=$(docker image inspect --format '{{index .RepoDigests 0}}' "$SNIPER_IMAGE")
          [[ "$sdk" == registry.gitlab.steamos.cloud/steamrt/sniper/sdk@sha256:* ]]
          echo "ZH_SNIPER_SDK=$sdk" >> "$GITHUB_ENV"
          echo "SDK: \`$sdk\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and audit the engine-only portable folder
        run: |
          bash GeneralsMD/Code/Tools/linux-portable.sh \
            --build "$RUNNER_TEMP/build" \
            --out "$RUNNER_TEMP/portable/ZeroHourReforged-linux-x86_64" \
            --cmake "$ZH_CMAKE" --image "$ZH_SNIPER_SDK" --jobs "$ZH_BUILD_JOBS" --no-art --no-tar
          python3 GeneralsMD/Code/Tools/linux-release.py audit-portable \
            "$RUNNER_TEMP/portable/ZeroHourReforged-linux-x86_64"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 GeneralsMD/Code/Tools/linux-release.py verify-tag \
              "$RUNNER_TEMP/portable/ZeroHourReforged-linux-x86_64/VERSION" "$GITHUB_REF_NAME"
          fi

      - name: Build tests incrementally in the same compatibility container
        run: |
          sdk_args=(--rm --platform linux/amd64 -u "$(id -u):$(id -g)" -e HOME=/tmp
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE"
            -v "$RUNNER_TEMP/build:$RUNNER_TEMP/build"
            -v "$RUNNER_TEMP/ci-tools:$RUNNER_TEMP/ci-tools:ro"
            -w "$RUNNER_TEMP/build")
          # CTest runs on Ubuntu after compilation in Sniper. Use an interpreter
          # path present in both, rather than Sniper's versioned python3.9 path.
          docker run "${sdk_args[@]}" "$ZH_SNIPER_SDK" \
            "$ZH_CMAKE" -S "$GITHUB_WORKSPACE/GeneralsMD/Code" -B "$RUNNER_TEMP/build" \
            -DPython3_EXECUTABLE=/usr/bin/python3 -DZH_GAME_DATA= -DZH_SPIRV_VAL=/usr/bin/spirv-val
          docker run "${sdk_args[@]}" "$ZH_SNIPER_SDK" \
            "$ZH_CMAKE" --build "$RUNNER_TEMP/build" --parallel "$ZH_BUILD_JOBS" \
            2>&1 | tee "$RUNNER_TEMP/reports/test-build.log"

      - name: Run CTest with Lavapipe and Xvfb, without original game data
        id: ctest
        timeout-minutes: 45
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_VIDEO_DRIVER: offscreen
          ZH_SPIRV_VAL: /usr/bin/spirv-val
          ZH_GAME_DATA: ''
          ZH_DATA_DIR: ''
          ZH_FFREF_CAPTURE_DIR: ''
          ZH_PORTABLE_CMAKE: ''
        run: |
          icd=$(find /usr/share/vulkan/icd.d -maxdepth 1 -name '*lvp*.json' -print -quit)
          [[ -n "$icd" && -f "$icd" ]] || { echo '::error::Lavapipe ICD is missing'; exit 1; }
          export VK_ICD_FILENAMES="$icd" VK_DRIVER_FILES="$icd"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          # The excluded integration test starts a second engine build. The real
          # portable build above already ran its ABI/dependency/license gates.
          timeout --signal=TERM --kill-after=30s 44m \
            xvfb-run -a --server-args='-screen 0 1280x720x24 -nolisten tcp' \
            "$(dirname "$ZH_CMAKE")/ctest" --test-dir "$RUNNER_TEMP/build" \
            --no-tests=error --parallel 2 --timeout 600 --output-on-failure \
            --output-junit "$RUNNER_TEMP/reports/ctest.xml" -E '^linux_portable_check$' \
            2>&1 | tee "$RUNNER_TEMP/reports/ctest.log"

      - name: Report omissions and require the software-rendering checks to pass
        if: ${{ always() && steps.ctest.outcome != 'skipped' }}
        run: python3 GeneralsMD/Code/Tools/linux-release.py ctest-summary "$RUNNER_TEMP/reports/ctest.xml"

      - name: Keep only build/test text diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-build-diagnostics
          path: |
            ${{ runner.temp }}/build/linux-portable.log
            ${{ runner.temp }}/build/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/reports/*.log
            ${{ runner.temp }}/reports/ctest.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Hand off the checked portable archive (never the build tree or game data)
        # Stage from the tested binaries, without rebuilding, then repeat the ABI
        # and license gates before writing the only archive that crosses jobs.
        run: |
          bash GeneralsMD/Code/Tools/linux-portable.sh \
            --build "$RUNNER_TEMP/build" \
            --out "$RUNNER_TEMP/portable/ZeroHourReforged-linux-x86_64" \
            --image "$ZH_SNIPER_SDK" --no-build --no-art

      - name: Upload the portable handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x86_64-portable
          path: ${{ runner.temp }}/portable/ZeroHourReforged-linux-x86_64.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  packages:
    name: AppImage, DEB, RPM and Arch packages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x86_64-portable
          path: ${{ runner.temp }}/portable
      - name: Cache verified AppImage tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-tools/appimage
          key: linux-appimage-x86_64-v1-${{ hashFiles('.github/scripts/linux-ci-tools.sh') }}
      - name: Prepare packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils zstd python3 squashfs-tools
          bash .github/scripts/linux-ci-tools.sh appimage "$RUNNER_TEMP/ci-tools"
          df -h "$RUNNER_TEMP"
      - name: Repackage the checked binary without compiling it again
        run: |
          bash GeneralsMD/Code/Tools/linux-packages.sh \
            --portable "$RUNNER_TEMP/portable/ZeroHourReforged-linux-x86_64.tar.zst" \
            --build "$RUNNER_TEMP/package-build" --out "$RUNNER_TEMP/packages" \
            --formats 'appimage deb rpm arch' --appimagetool "$ZH_APPIMAGETOOL" --runtime "$ZH_APPIMAGE_RUNTIME"
          python3 GeneralsMD/Code/Tools/linux-release.py verify-checksums "$RUNNER_TEMP/packages"
      - name: Keep packaging text diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-native-packaging-diagnostics
          path: ${{ runner.temp }}/package-build/packages/*.log
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-native-packages
          path: |
            ${{ runner.temp }}/packages/*.AppImage
            ${{ runner.temp }}/packages/*.deb
            ${{ runner.temp }}/packages/*.rpm
            ${{ runner.temp }}/packages/*.pkg.tar.zst
            ${{ runner.temp }}/packages/ZeroHourReforged-linux-x86_64.tar.zst
            ${{ runner.temp }}/packages/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  flatpak:
    name: Flatpak on an isolated runner
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x86_64-portable
          path: ${{ runner.temp }}/portable
      - name: Prepare space for the Flatpak SDK
        id: cache-key
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils zstd python3
          sudo apt-get clean
          df -h "$RUNNER_TEMP"
          free_kib=$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')
          (( free_kib >= 12 * 1024 * 1024 )) || { echo '::error::Need 12 GiB free for Flatpak packaging'; exit 1; }
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore the Flatpak runtime/SDK (no app build or player data)
        id: flatpak-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/package-build/flatpak-cache
          key: linux-flatpak-x86_64-v1-${{ steps.cache-key.outputs.month }}-${{ hashFiles('GeneralsMD/Code/Tools/linux-packages/io.github.olcayseygan.ZeroHourReforged.yml') }}
      - name: Build the Flatpak from the same portable archive
        run: |
          # linux-packages.sh uses a privileged throwaway Fedora container for
          # Flatpak/bubblewrap. No SDK/compiler image or game data is mounted.
          bash GeneralsMD/Code/Tools/linux-packages.sh \
            --portable "$RUNNER_TEMP/portable/ZeroHourReforged-linux-x86_64.tar.zst" \
            --build "$RUNNER_TEMP/package-build" --out "$RUNNER_TEMP/packages" --formats flatpak
          python3 GeneralsMD/Code/Tools/linux-release.py verify-checksums "$RUNNER_TEMP/packages"
      - name: Bound the persistent runtime cache
        id: cache-size
        run: |
          size_kib=$(du -sk "$RUNNER_TEMP/package-build/flatpak-cache" | cut -f1)
          if (( size_kib <= 4 * 1024 * 1024 )); then
            echo 'save=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Flatpak runtime cache exceeds 4 GiB; this run will not save it'
          fi
      - name: Save only a bounded successful runtime cache
        if: ${{ steps.flatpak-cache.outputs.cache-hit != 'true' && steps.cache-size.outputs.save == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/package-build/flatpak-cache
          key: ${{ steps.flatpak-cache.outputs.cache-primary-key }}
      - name: Keep Flatpak text diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-flatpak-packaging-diagnostics
          path: ${{ runner.temp }}/package-build/packages/flatpak*.log
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-flatpak-package
          path: |
            ${{ runner.temp }}/packages/io.github.olcayseygan.ZeroHourReforged.flatpak
            ${{ runner.temp }}/packages/ZeroHourReforged-linux-x86_64.tar.zst
            ${{ runner.temp }}/packages/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  package-check:
    name: Package install / ${{ matrix.distro }}
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        distro: [debian-12, ubuntu-24.04, fedora, opensuse-tumbleweed, archlinux, appimage]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-native-packages
          path: ${{ runner.temp }}/packages
      - name: Check checksums, install and exercise the missing-data startup contract
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          python3 GeneralsMD/Code/Tools/linux-release.py verify-checksums "$RUNNER_TEMP/packages"
          bash GeneralsMD/Code/Tools/linux-packages-check.sh \
            --packages "$RUNNER_TEMP/packages" --no-data --distros "$DISTRO" --remove-images \
            2>&1 | tee "$RUNNER_TEMP/package-check.log"
      - name: State package-check coverage
        if: ${{ always() }}
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          {
            echo "## Package install check: $DISTRO"
            echo 'Minimum dependencies, installed layout/loader and missing-data startup contract.'
            echo 'Replay CRCs and gameplay-rendering checks are NOT RUN: proprietary game data is absent.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: linux-install-${{ matrix.distro }}-diagnostics
          path: ${{ runner.temp }}/package-check.log
          if-no-files-found: warn
          retention-days: 7

  assemble:
    name: Verify complete download set
    needs: [packages, flatpak, package-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-native-packages
          path: ${{ runner.temp }}/native
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-flatpak-package
          path: ${{ runner.temp }}/flatpak
      - name: Require all six formats and one identical engine archive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd
          python3 GeneralsMD/Code/Tools/linux-release.py assemble \
            "$RUNNER_TEMP/native" "$RUNNER_TEMP/flatpak" "$RUNNER_TEMP/release"
          {
            echo '## Downloads'
            echo 'All six formats and SHA256SUMS are in the linux-x86_64-packages artifact.'
            echo 'Engine only: supply your own Generals and Zero Hour installation. No Reforged art is included.'
            echo 'Flatpak is built and exported; sandbox gameplay/portal/Steam Deck validation still requires a local run.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x86_64-packages
          path: |
            ${{ runner.temp }}/release/*.AppImage
            ${{ runner.temp }}/release/*.deb
            ${{ runner.temp }}/release/*.rpm
            ${{ runner.temp }}/release/*.pkg.tar.zst
            ${{ runner.temp }}/release/*.flatpak
            ${{ runner.temp }}/release/ZeroHourReforged-linux-x86_64.tar.zst
            ${{ runner.temp }}/release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish version-tag packages
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # This job runs no repository scripts, only the verified package handoff.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x86_64-packages
          path: ${{ runner.temp }}/release
      - name: Create a draft, upload checked files and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum --check --strict SHA256SUMS
          [[ $(wc -l < SHA256SUMS) -eq 6 ]]
          mapfile -t assets < <(awk '{print $2}' SHA256SUMS)
          assets+=(SHA256SUMS)
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/is-draft"; then
            if [[ $(cat "$RUNNER_TEMP/is-draft") != true ]]; then
              mkdir -p "$RUNNER_TEMP/published"
              for asset in "${assets[@]}"; do
                gh release download "$RELEASE_TAG" --pattern "$asset" --dir "$RUNNER_TEMP/published"
              done
              cmp SHA256SUMS "$RUNNER_TEMP/published/SHA256SUMS" || {
                echo '::error::A published release already has different packages; use a new version tag.'
                exit 1
              }
              (cd "$RUNNER_TEMP/published" && sha256sum --check --strict SHA256SUMS)
              echo 'Published checksums already match; leaving the release unchanged.'
              exit 0
            fi
          else
            cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Engine-only Linux x86_64 packages for Zero Hour Reforged.

          Built in Valve's Steam Runtime Sniper SDK with a glibc 2.31 ABI ceiling and static C++ runtime.
          Supply your own legally owned Command & Conquer Generals and Zero Hour installation. Original game data and Reforged art are not included.

          Download a package for your distribution, or the AppImage/portable tarball. Check downloads with `sha256sum -c SHA256SUMS` (download every listed package for a complete check).

          Public CI covers asset-independent CTest checks with Mesa Lavapipe/Xvfb and minimum-dependency package installation/startup on Debian, Ubuntu, Fedora, openSUSE and Arch. Full replay CRCs, gameplay/render parity, Flatpak portal/gameplay and Steam Deck hardware checks require separate local validation.
          NOTES
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Zero Hour Reforged $RELEASE_TAG — Linux x86_64" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          # Re-running an interrupted draft can replace only this pipeline's files.
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
