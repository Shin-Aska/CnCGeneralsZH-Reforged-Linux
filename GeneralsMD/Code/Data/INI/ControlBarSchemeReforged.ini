; Zero Hour Reforged command bar schemes, loaded after ControlBarScheme.ini. A scheme EA defined is
; edited in place and a block holds only what changes.
;
; Not in the multiplayer INI checksum: a scheme only places the bar's windows.
;
; The Classic bar's four small buttons down the left of the middle plate: options, idle worker,
; beacon and chat. EA put them at x 184-220, 36 wide, on every side. America's plate leaves them a
; strip from design x 187 to 223 (measured at 1920x1080), so EA's buttons lay over its left rib and
; the American schemes move them 3 to the right at EA's size and on EA's rows. Nothing may pass 223:
; the build grid's first column starts there (ControlBar.wnd, ButtonCommand01). The Observer scheme
; wears the American plate and moves with America. China and the GLA keep EA's place, the way 1.04
; drew them. Watching a player puts his side's scheme on, so the observer bar follows whichever side
; it shows. The Reforged interface stands the four buttons down and draws its own.
;
; EA's Chinese beacon button at rest, SNBeacon, has no alpha, so it stood on a black card. The
; Chinese schemes wear ReforgedChinaBeacon, the same picture with its corners open
; (Tools/china_beacon.py).

ControlBarScheme America8x6
  OptionsUL X:187 Y:490
  OptionsLR X:223 Y:514
  WorkerUL X:187 Y:516
  WorkerLR X:223 Y:540
  BeaconUL X:187 Y:545
  BeaconLR X:223 Y:566
  ChatUL X:187 Y:568
  ChatLR X:223 Y:592
End

