; Zero Hour Reforged command bar schemes, loaded after ControlBarScheme.ini. A scheme EA defined is
; edited in place and a block holds only what changes.
;
; Not in the multiplayer INI checksum: a scheme only places the bar's windows.
;
; The Classic bar's four small buttons down the left of the middle plate: options, idle worker,
; beacon and chat. EA put them at x 184-220, 36 wide. Each faction's plate leaves them a strip
; between its left rib and the dark screen, and the strips do not quite agree: America's runs from
; design x 187 to 223, China's from 188 to 226, the GLA's from 182 to 220 (measured at 1920x1080).
; EA's buttons lay over the American and Chinese ribs and ran up to the edge of the GLA screen. At
; 28x20 from x 190 they fit inside all three, each centred on the row EA gave it. Watching a player
; puts his side's scheme on, so the observer bar wears these too. The Reforged interface stands the
; four buttons down and draws its own.

ControlBarScheme America8x6
  OptionsUL X:190 Y:492
  OptionsLR X:218 Y:512
  WorkerUL X:190 Y:518
  WorkerLR X:218 Y:538
  BeaconUL X:190 Y:546
  BeaconLR X:218 Y:566
  ChatUL X:190 Y:570
  ChatLR X:218 Y:590
End

