; Modern water material rules. Classic water keeps the map's original settings.
; A rule matches ANY listed color AND ANY listed texture (case-insensitive basename).
; Add Color and Texture entries to extend the lists. First matching enabled rule wins.
; Keep separate rules when only specific color/texture pairs should match.
; ReplacementColor is display RGB, Brightness is 0.1..1, Pollution/UnderwaterClarity are 0..1.
; ReflectionStrength is 0..4 and defaults to 1; it adjusts Path traced reflections only.
; Other optional fields default to Brightness=1, Pollution=0, UnderwaterClarity=0, Bubbles=No, Enabled=Yes.
; UnderwaterClarity reduces authored absorption on shallow shelves, retaining deep/open-sea opacity.
; ReflectionStrength is artistic compensation for steep RTS views, not a physical material parameter.
; Map depth/opacity data and Classic water are unchanged.
; Missing/invalid file uses these built-in defaults; invalid files log the error line.
; An empty/comment-only file disables every rule. Enabled=No disables one rule.
; This file is read only: the game never regenerates or overwrites custom edits.

ModernWaterRule PollutedWater
  MatchColors
    Color = R:50 G:75 B:50
  End

  MatchTextures
    Texture = TSWater03.tga
  End

  ReplacementColor = R:45 G:58 B:11
  Brightness = 0.67
  Pollution = 0.80
  Bubbles = Yes
End

; Clear water exposes shallow, raised seabed details while flat offshore floors retain depth fog.
ModernWaterRule ClearWater
  MatchColors
    Color = R:255 G:255 B:255
  End

  MatchTextures
    Texture = TWWater01.tga
  End

  ReplacementColor = R:255 G:255 B:255
  UnderwaterClarity = 0.90
  ReflectionStrength = 2.0
End
