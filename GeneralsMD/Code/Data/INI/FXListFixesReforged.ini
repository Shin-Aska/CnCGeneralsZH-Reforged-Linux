; FX placement fixes shared by Classic and Reforged graphics.
; Loaded after EA's FXList.ini, before the cosmetic FXListReforged.ini overrides.
; Both modes read this file into the multiplayer INI CRC.

; The bomb bursts on the ground in both modes. Keep only its two ground-aligned
; systems clear of the terrain; EA's other particles, sound and shake stay as-is.
FXList WeaponFX_EMPPulseImpact
  ParticleSystem
    Name = EMPLensFlare
  End
  ParticleSystem
    Name = EMPLensFlare1
  End
  ParticleSystem
    Name = EMPLensFlare2
    Offset = X:0 Y:0 Z:15
  End
  ParticleSystem
    Name = EMPRing
    Offset = X:0 Y:0 Z:15
  End
  Sound
    Name = EMPPulseWhoosh
  End
  ViewShake
    Type = STRONG
  End
End
